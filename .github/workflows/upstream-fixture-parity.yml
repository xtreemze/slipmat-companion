name: Upstream Fixture Parity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    branches: [main]
    paths:
      - "schema/examples/**"
      - "schema/upstream-parity-files.txt"
      - "scripts/verify_upstream_fixture_parity.py"
      - ".github/workflows/upstream-fixture-parity.yml"
  push:
    branches: [main]
    paths:
      - "schema/examples/**"
      - "schema/upstream-parity-files.txt"
      - "scripts/verify_upstream_fixture_parity.py"
      - ".github/workflows/upstream-fixture-parity.yml"

permissions:
  contents: read

jobs:
  fixture-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout companion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          path: companion
          persist-credentials: false

      - name: Checkout canonical Slipmat fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          repository: xtreemze/slipmat
          ref: main
          path: slipmat
          persist-credentials: false

      - name: Compare mirrored canonical fixtures
        run: |
          python3 companion/scripts/verify_upstream_fixture_parity.py \
            --companion-root companion \
            --upstream-root slipmat
