name: VFS disposable systemd integration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vfs-disposable-systemd.yml"
      - "MaintenanceRunner/**"
      - "Models/CloudMaintenance.cs"
      - "Models/CloudMigration.cs"
      - "Models/CloudProjection.cs"
      - "Services/CloudMigrationJournal.cs"
      - "Services/CloudMigrationManifestBuilder.cs"
      - "Services/CloudMaintenanceConfiguration.cs"
      - "Services/CloudMaintenanceProfileConfiguration.cs"
      - "Services/CloudMaintenanceTransaction.cs"
      - "scripts/maintenance-vm-fixture/**"
      - "scripts/prove_maintenance_runner_vm.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-systemd-vfs:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"

      - name: Verify disposable host boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = 10.0.401
          test "$(cat /proc/1/comm)" = systemd
          test "$(lsb_release -rs)" = 26.04
          test -c /dev/fuse
          test ! -e /usr/lib/systemd/system/jellyfin.service
          test ! -e /lib/systemd/system/jellyfin.service
          test ! -e /etc/systemd/system/jellyfin.service
          test ! -L /etc/systemd/system/jellyfin.service
          test ! -e /run/systemd/system/jellyfin.service
          sudo test ! -e /mnt/slipmat-maintenance-fixture-gha
          command -v setpriv
          command -v python3.14
          sudo mkdir -p /usr/local/libexec/slipmat-vfs-proof
          sudo ln -s /dev/null /etc/systemd/system/jellyfin.service
          sudo systemctl daemon-reload

      - name: Install reviewed rclone 1.74.4 artifact
        shell: bash
        env:
          RCLONE_SHA256: fe435e0c36228e7c2f116a8701f01127bb1f694005fc11d1f27186c8bca4115d
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rclone-v1.74.4-linux-amd64.zip"
          curl --fail --location --silent --show-error --retry 3 \
            https://downloads.rclone.org/v1.74.4/rclone-v1.74.4-linux-amd64.zip \
            --output "$archive"
          echo "$RCLONE_SHA256  $archive" | sha256sum --strict --check
          unzip -p "$archive" rclone-v1.74.4-linux-amd64/rclone > "$RUNNER_TEMP/rclone"
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP/rclone" /usr/local/libexec/slipmat-vfs-proof/rclone
          /usr/local/libexec/slipmat-vfs-proof/rclone version

      - name: Build runner and synthetic fixture from exact source
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish MaintenanceRunner/Slipmat.MaintenanceRunner.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            --output "$RUNNER_TEMP/vfs-runner"
          dotnet publish scripts/maintenance-vm-fixture/Fixture.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            --output "$RUNNER_TEMP/vfs-fixture"
          sudo cp -a "$RUNNER_TEMP/vfs-runner" /usr/local/libexec/slipmat-vfs-proof/runner
          sudo cp -a "$RUNNER_TEMP/vfs-fixture" /usr/local/libexec/slipmat-vfs-proof/fixture
          sudo install -o root -g root -m 0755 MaintenanceRunner/custody.py /usr/local/libexec/slipmat-vfs-proof/custody.py
          sudo install -o root -g root -m 0755 scripts/prove_maintenance_runner_vm.sh /usr/local/libexec/slipmat-vfs-proof/prove.sh
          sudo install -o root -g root -m 0755 scripts/prove_maintenance_sigkill_vm.sh /usr/local/libexec/slipmat-vfs-proof/prove-sigkill.sh
          sh -n scripts/prove_maintenance_sigkill_vm.sh
          sudo chown -R root:root /usr/local/libexec/slipmat-vfs-proof
          sudo chmod -R go-w /usr/local/libexec/slipmat-vfs-proof

      - name: Verify rclone FUSE and real systemd startup barriers
        shell: bash
        run: |
          set -euo pipefail
          sudo /bin/sh /usr/local/libexec/slipmat-vfs-proof/prove.sh \
            /mnt/slipmat-maintenance-fixture-gha \
            /usr/local/libexec/slipmat-vfs-proof/runner/Slipmat.MaintenanceRunner \
            /usr/local/libexec/slipmat-vfs-proof/fixture/Fixture \
            /usr/local/libexec/slipmat-vfs-proof/rclone \
            /usr/local/libexec/slipmat-vfs-proof/custody.py

      - name: SIGKILL offline verifier and re-open authoritative journal
        shell: bash
        run: |
          set -euo pipefail
          sudo /bin/sh /usr/local/libexec/slipmat-vfs-proof/prove-sigkill.sh \
            /mnt/slipmat-maintenance-fixture-gha-kill \
            /usr/local/libexec/slipmat-vfs-proof/runner/Slipmat.MaintenanceRunner \
            /usr/local/libexec/slipmat-vfs-proof/fixture/Fixture \
            /usr/local/libexec/slipmat-vfs-proof/rclone \
            /usr/local/libexec/slipmat-vfs-proof/custody.py

      - name: Check systemd fixture was restored
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /etc/systemd/system/jellyfin.service ] || [ -L /etc/systemd/system/jellyfin.service ]; then
            test "$(readlink /etc/systemd/system/jellyfin.service)" = /dev/null
          fi
          test ! -e /run/systemd/system/jellyfin.service
