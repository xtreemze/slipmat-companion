name: Automatic release and Pages manifest

on:
  workflow_run:
    workflows: ["Companion CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: companion-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish tested companion version
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.state.outputs.publish }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read reviewed release metadata
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re

          text = pathlib.Path("build.yaml").read_text(encoding="utf-8")
          match = re.search(r'^version:\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if match is None:
              raise SystemExit("build.yaml: quoted version field not found")
          print(f"version={match.group(1)}")
          PY

      - name: Verify distribution and metadata
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          python3 scripts/verify_distribution_policy.py --require-approved
          python3 scripts/verify_release_metadata.py --expected-version "$VERSION"

      - name: Check whether version is already released
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Audio Gateway $VERSION is already released; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tested release candidate
        if: steps.state.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: companion-release-candidate-${{ steps.metadata.outputs.version }}
          path: candidate
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Set up Node for companion site
        if: steps.state.outputs.publish == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build companion site
        if: steps.state.outputs.publish == 'true'
        run: |
          npm install --prefix site --no-audit --no-fund
          npm run build --prefix site
          test -f site/dist/index.html
          test -f site/dist/onboarding/index.html
          test -f site/dist/story/index.html
          npm run check:links --prefix site

      - name: Prepare Pages manifest
        if: steps.state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="candidate/AudioGateway_$VERSION.zip"
          CHANGELOG="candidate/changelog.md"
          test -f "$ZIP"
          test -s "$CHANGELOG"

          test -d site/dist

          PREVIOUS_ARGS=()
          if [ "$(gh release list --limit 1 --json tagName --jq 'length')" -gt 0 ]; then
            REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
            PAGES_MANIFEST="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}/manifest.json"
            curl --fail --silent --show-error --location "$PAGES_MANIFEST" \
              --output site/dist/previous-manifest.json
            PREVIOUS_ARGS=(--previous-manifest site/dist/previous-manifest.json)
          fi

          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/AudioGateway_$VERSION.zip"
          python3 scripts/generate_manifest.py \
            --zip "$ZIP" \
            --version "$VERSION" \
            --source-url "$SOURCE_URL" \
            --timestamp "$TIMESTAMP" \
            --changelog-file "$CHANGELOG" \
            --output site/dist/manifest.json \
            "${PREVIOUS_ARGS[@]}"
          python3 -m json.tool site/dist/manifest.json >/dev/null

      - name: Upload Pages artifact
        if: steps.state.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

      - name: Create GitHub Release
        if: steps.state.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "v$VERSION" "candidate/AudioGateway_$VERSION.zip" \
            --target "$SOURCE_SHA" \
            --title "Audio Gateway $VERSION" \
            --notes-file candidate/changelog.md

  deploy:
    name: Deploy Jellyfin repository manifest
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
