name: Release plugin and Pages manifest

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part Jellyfin plugin version, for example 0.1.0.0
        required: true
        type: string
      changelog:
        description: Release notes written into the Jellyfin repository manifest
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DOTNET_SDK_VERSION: "10.0.401"

jobs:
  release:
    name: Build, publish release, and prepare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: plugin-release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"

      - name: Validate requested version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must use four-part Jellyfin form" >&2
            exit 1
          fi
          printf 'version=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release policy and reviewed metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"
          python3 scripts/verify_distribution_policy.py --require-approved
          python3 scripts/verify_release_metadata.py --expected-version "$VERSION"

      - name: Restore and test
        run: |
          dotnet restore Jellyfin.Plugin.AudioGateway.slnx
          dotnet build Jellyfin.Plugin.AudioGateway.slnx --configuration Release --no-restore
          dotnet test Tests/Jellyfin.Plugin.AudioGateway.Tests.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --logger "console;verbosity=minimal"

      - name: Publish and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/publish site
          dotnet publish Jellyfin.Plugin.AudioGateway.csproj \
            --configuration Release \
            --no-restore \
            --output dist/publish \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION"
          python3 scripts/package_plugin.py \
            --input dist/publish/Jellyfin.Plugin.AudioGateway.dll \
            --output "dist/AudioGateway_$VERSION.zip" \
            --version "$VERSION"

      - name: Write changelog
        env:
          RELEASE_NOTES: ${{ inputs.changelog }}
        run: printf '%s\n' "$RELEASE_NOTES" > dist/changelog.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "dist/AudioGateway_$VERSION.zip" --clobber
            gh release edit "v$VERSION" \
              --title "Audio Gateway $VERSION" \
              --notes-file dist/changelog.md
          else
            gh release create "v$VERSION" "dist/AudioGateway_$VERSION.zip" \
              --title "Audio Gateway $VERSION" \
              --notes-file dist/changelog.md
          fi

      - name: Generate Jellyfin repository manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp pages/index.html site/index.html
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/AudioGateway_$VERSION.zip"
          python3 scripts/generate_manifest.py \
            --zip "dist/AudioGateway_$VERSION.zip" \
            --version "$VERSION" \
            --source-url "$SOURCE_URL" \
            --timestamp "$TIMESTAMP" \
            --changelog-file dist/changelog.md \
            --output site/manifest.json
          python3 -m json.tool site/manifest.json >/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy manifest to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
