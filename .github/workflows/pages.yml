name: Companion site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: companion-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install site dependencies
        run: npm install --prefix site --no-audit --no-fund

      - name: Certify Vite presentation contract
        run: npm test --prefix site

      - name: Build and audit Vite site
        run: |
          npm run build --prefix site
          npm run check:links --prefix site
          test -s site/dist/index.html
          test -s site/dist/onboarding/index.html
          test -s site/dist/story/index.html
          grep -q 'data-site-generator="vite"' site/dist/index.html
          if grep -Eq '"(astro|esbuild)"' site/package.json; then
            echo "Presentation toolchain must not depend on Astro or esbuild."
            exit 1
          fi

      - name: Preserve published Jellyfin manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://xtreemze.github.io/slipmat-companion/manifest.json" \
            --output site/dist/manifest.json
          python3 -m json.tool site/dist/manifest.json >/dev/null

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
