name: Companion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SDK_VERSION: "10.0.401"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"

      - name: Read reviewed release metadata
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib
          import re

          text = pathlib.Path("build.yaml").read_text(encoding="utf-8")
          match = re.search(r'^version:\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if match is None:
              raise SystemExit("build.yaml: quoted version field not found")
          print(f"version={match.group(1)}")
          PY

      - name: Verify toolchain and release metadata
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"
          python3 scripts/verify_distribution_policy.py
          python3 scripts/verify_release_metadata.py --expected-version "$VERSION"

      - name: Verify canonical fixture provenance
        run: python3 scripts/verify_upstream_fixture_parity.py

      - name: Set up Node for companion site
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Build companion site
        run: |
          npm install --prefix site --no-audit --no-fund
          npm run build --prefix site
          test -f site/dist/index.html
          test -f site/dist/onboarding/index.html
          test -f site/dist/story/index.html
          npm run check:links --prefix site

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.AudioGateway.slnx

      - name: Build
        run: dotnet build Jellyfin.Plugin.AudioGateway.slnx --configuration Release --no-restore

      - name: Resolve Jellyfin FFmpeg parity decoder
        id: ffmpeg
        shell: bash
        env:
          JELLYFIN_FFMPEG_VERSION: "8.1.3-1"
          JELLYFIN_FFMPEG_SHA256: "b86dc023c64a5a9a410e6e3a938a970460214fae78f31c1553c9f88f1c289b6a"
        run: |
          archive="$RUNNER_TEMP/jellyfin-ffmpeg.tar.xz"
          root="$RUNNER_TEMP/jellyfin-ffmpeg"
          curl --fail --location --silent --show-error \
            "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${JELLYFIN_FFMPEG_VERSION}/jellyfin-ffmpeg_${JELLYFIN_FFMPEG_VERSION}_portable_linux64-gpl.tar.xz" \
            --output "$archive"
          echo "${JELLYFIN_FFMPEG_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$root"
          tar -xJf "$archive" -C "$root"
          path="$root/ffmpeg"
          test -x "$path"
          LD_LIBRARY_PATH="$root/lib" "$path" -version
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "lib=$root/lib" >> "$GITHUB_OUTPUT"

      - name: Test
        env:
          SLIPMAT_PARITY_FFMPEG: ${{ steps.ffmpeg.outputs.path }}
          LD_LIBRARY_PATH: ${{ steps.ffmpeg.outputs.lib }}
        run: dotnet test Tests/Jellyfin.Plugin.AudioGateway.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Package and exercise manifest tooling
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p dist/publish site
          dotnet publish Jellyfin.Plugin.AudioGateway.csproj \
            --configuration Release \
            --no-restore \
            --output dist/publish \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION"

          python3 scripts/package_plugin.py \
            --input dist/publish/Jellyfin.Plugin.AudioGateway.dll \
            --output "dist/AudioGateway_$VERSION.zip" \
            --version "$VERSION"

          python3 - <<'PY' > dist/changelog.md
          import pathlib
          import re

          text = pathlib.Path("build.yaml").read_text(encoding="utf-8")
          match = re.search(r'^changelog:\s*"([^"]+)"\s*$', text, re.MULTILINE)
          if match is None:
              raise SystemExit("build.yaml: quoted changelog field not found")
          print(match.group(1))
          PY

          python3 scripts/generate_manifest.py \
            --zip "dist/AudioGateway_$VERSION.zip" \
            --version "$VERSION" \
            --source-url "https://example.invalid/AudioGateway_$VERSION.zip" \
            --timestamp 2026-01-01T00:00:00Z \
            --changelog-file dist/changelog.md \
            --output site/manifest.json
          python3 -m json.tool site/manifest.json >/dev/null

      - name: Upload tested release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: companion-release-candidate-${{ steps.metadata.outputs.version }}
          path: |
            dist/AudioGateway_${{ steps.metadata.outputs.version }}.zip
            dist/changelog.md
          if-no-files-found: error
          retention-days: 7
