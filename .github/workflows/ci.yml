name: Companion CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SDK_VERSION: "10.0.401"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.401"

      - name: Verify toolchain and release metadata
        run: |
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"
          python3 scripts/verify_distribution_policy.py
          python3 scripts/verify_release_metadata.py

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.AudioGateway.slnx

      - name: Build
        run: dotnet build Jellyfin.Plugin.AudioGateway.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/Jellyfin.Plugin.AudioGateway.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Exercise package and manifest tooling
        run: |
          mkdir -p dist/publish site
          dotnet publish Jellyfin.Plugin.AudioGateway.csproj --configuration Release --no-restore --output dist/publish
          python3 scripts/package_plugin.py             --input dist/publish/Jellyfin.Plugin.AudioGateway.dll             --output dist/AudioGateway_0.1.0.0.zip             --version 0.1.0.0
          printf '%s\n' 'CI manifest fixture' > dist/changelog.md
          python3 scripts/generate_manifest.py             --zip dist/AudioGateway_0.1.0.0.zip             --version 0.1.0.0             --source-url https://example.invalid/AudioGateway_0.1.0.0.zip             --timestamp 2026-01-01T00:00:00Z             --changelog-file dist/changelog.md             --output site/manifest.json
          python3 -m json.tool site/manifest.json >/dev/null
