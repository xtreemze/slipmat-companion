overview: "Optional Jellyfin companion that accelerates and enriches Slipmat."
description: >
  Audio Gateway reduces Jellyfin request fan-out, serves precomputed audio-analysis
  artifacts, provides bounded podcast/directory/media acquisition when browser networking
  prevents direct access, projects selected iptv-org channels through Jellyfin Live TV,
  and can expose an operator-configured rclone remote through a bounded read-only VFS cache
  as a guarded Jellyfin library. Slipmat remains fully functional without the companion and retains all product authority.
