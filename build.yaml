overview: "Optional Jellyfin companion that accelerates and enriches Slipmat."
description: >
  Audio Gateway reduces Jellyfin request fan-out, serves precomputed audio-analysis
  artifacts, provides bounded podcast/directory/media acquisition when browser networking
  prevents direct access, projects selected iptv-org channels through Jellyfin Live TV,
  and can expose an operator-configured rclone remote through a bounded read-only VFS cache
  as a guarded Jellyfin library. Slipmat remains fully functional without the companion and retains all product authority.
category: "General"
owner: "xtreemze"
artifacts:
- "Jellyfin.Plugin.AudioGateway.dll"
changelog: "Add operator-approved current-source recovery for interrupted local-to-VFS jobs. Read-only downloaded-content verification must prove the existing partial cloud copy matches the current local source before adopting a fresh inventory. Retain prior baselines in the same durable job, reject drift and conflicts, and continue with immutable copy plus exact full verification. Queue long preflight work with restart recovery and show native Fetch error codes. No automatic cutover or media deletion."
