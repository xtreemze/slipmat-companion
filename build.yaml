framework: "net10.0"
overview: "Optional Jellyfin companion that accelerates and enriches Slipmat."
description: >
  Audio Gateway reduces Jellyfin request fan-out, serves precomputed audio-analysis
  artifacts, provides bounded podcast/directory/media acquisition when browser networking
  prevents direct access, projects selected iptv-org channels through Jellyfin Live TV,
  and can expose an operator-configured rclone remote through a bounded read-only VFS cache
  as a guarded Jellyfin library. Slipmat remains fully functional without the companion and retains all product authority.
category: "General"
owner: "xtreemze"
artifacts:
- "Jellyfin.Plugin.AudioGateway.dll"
changelog: "Add a read-only rclone VFS setup preflight with a version-unsupported status and a warning when the VFS cache sits on a network-like filesystem, bound VFS scan egress (no read-ahead, no embedded-art extraction), gate VFS retirement on custody certification and harden rclone migration verification, add album packaging image captures from Cover Art Archive, TheAudioDB and Discogs together with the Package Inspector physicalMediaMaterials cache, and add a dashboard setup-readiness panel with scan guidance."