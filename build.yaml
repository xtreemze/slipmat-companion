changelog: "Add explicit verified archive-and-repair for cloud metadata conflicts. Preserve every conflicting remote original before repair, block audio and unsupported conflicts, retain resumable job custody, and require normal copy/download verification. Recovered jobs require offline maintenance for VFS promotion."
