changelog: "Add safe legacy cloud VFS mount-path recovery with a server-verified unused mount suggestion and explicit Save, preserving all copied media. Add guided migration mapping for unmatched libraries, enabled-profile remediation and saved empty-destination preflight. Reject unsaved mount settings and expose actionable cloud migration failures. No automatic deletion or unverified cutover."
